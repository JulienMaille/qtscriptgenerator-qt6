name: Linux Qt 6.12

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish this tag to its GitHub release (for example v0.2.2)'
        type: string
        required: false

permissions:
  contents: write
  actions: read

env:
  QT_VERSION: '6.12.1'
  QT_ARTIFACT_ID: 'linux-gcc'
  QTSCRIPT_REF: 'main'

concurrency:
  group: linux-612-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Qt 6.12 GCC 64-bit (Release)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out bindings
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # A dispatch naming a tag builds that tag: that is how a release
          # published before this step existed is rebuilt.
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Check out QtScript port
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JulienMaille/qtscript-qt6
          ref: ${{ env.QTSCRIPT_REF }}
          path: qtscript-qt6
          submodules: true

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          cache: true

      - name: Build QtScript dependency
        shell: bash
        env:
          QSCRIPT_WORK_ROOT: ${{ runner.temp }}/qtscript-work
        run: >-
          ./qtscript-qt6/scripts/build-linux.sh
          --qt-root "$QT_ROOT_DIR"
          --work-root "$QSCRIPT_WORK_ROOT"
          --configuration Release
          --parallel 4

      - name: Build bindings
        shell: bash
        run: ./build-linux.sh --qt-prefix "$QT_ROOT_DIR" --configuration Release --parallel 4

      - name: Run binding smoke tests
        shell: bash
        run: ./test-linux.sh --qt-prefix "$QT_ROOT_DIR" --configuration Release --timeout 120

      - name: Upload Release bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qtscriptgenerator-qt${{ env.QT_VERSION }}-${{ env.QT_ARTIFACT_ID }}-Release
          path: |
            plugins/script/*.so
            qtbindings/qs_eval/release/qs_eval
          if-no-files-found: error
          retention-days: 3
      - name: Publish release assets
        # Publishing is a durable copy: the uploaded artifact is kept three days
        # only, so a tag left without this step loses its binaries. The raw
        # artifact zip is republished as the release asset, which is what the
        # v0.1.0 assets are, so nothing invents a new archive layout.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          name="qtscriptgenerator-qt${QT_VERSION}-${QT_ARTIFACT_ID}-Release"
          asset="${name}.zip"
          echo "Publishing ${asset} to ${tag}"
          json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          id=$(printf '%s' "$json" | jq -r --arg n "$name" '.artifacts[] | select(.name == $n) | .id' | head -n 1)
          if [ -z "$id" ]; then
            echo "Artifact ${name} not found in run ${GITHUB_RUN_ID}" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$asset"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            # Two platforms can publish to the same release at once: losing the
            # race is fine as long as the release exists afterwards.
            gh release create "$tag" --title "$tag" --generate-notes \
              || gh release view "$tag" > /dev/null 2>&1
          fi
          gh release upload "$tag" "$asset" --clobber
